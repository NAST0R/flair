name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows non è un extra: parecchio codice ha rami `os.name == "nt"` (quoting
        # di cmd.exe, PowerShell su file temporaneo, spinner del terminale, permessi
        # dei file) che su Linux NON vengono mai eseguiti — un test rotto proprio lì
        # è rimasto invisibile alla CI per settimane. Una sola versione di Python su
        # Windows basta a coprire quei rami senza raddoppiare i minuti di build.
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev tools)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check flair tests tools

      - name: Type-check (mypy)
        run: mypy flair tools

      - name: Tests
        run: python tests/test_smoke.py

      - name: Eval self-test
        run: python tests/evals/run_evals.py --self-test
