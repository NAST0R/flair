[project]
name = "flair"
version = "3.0.0"
description = "Agentic AI assistant (advanced coding + general desktop automation) on DeepSeek and OpenAI."
requires-python = ">=3.10"
dependencies = [
    # Capped below 3.0: from that release the SDK moved from httpx to httpx2, so the
    # network errors that escape it are httpx2.* and our transient-error
    # classification (_HTTPX_TRANSIENT) would stop matching them — silently. Add and
    # test httpx2 support before raising the cap.
    "openai>=1.40.0,<3.0",
    # Used DIRECTLY (explicit client for a custom CA bundle on self-signed endpoints,
    # transient network error classification), so it is declared here rather than
    # inherited from openai: up to 2.x it arrived transitively, with 3.x it did not.
    "httpx>=0.27,<1",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "ddgs>=9.0",          # key-free web search for the general agent
    "pypdf>=5.0",         # PDF text extraction (pure Python, no transitive deps)
]

[project.optional-dependencies]
# Optional extras for the general agent (detailed RAM/CPU, portable clipboard).
extras = ["psutil>=5.9.0", "pyperclip>=1.8.0"]
# Development tools (test, lint, type-check).
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
flair = "flair.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flair", "flair.llm", "flair.core", "flair.tools", "flair.agents", "flair.prompts"]

[tool.setuptools.package-data]
"flair.prompts" = ["*.md"]
"flair" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by the formatter

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # openai/psutil/pyperclip not always typed
warn_unused_ignores = false
check_untyped_defs = true
